<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background — warm white paper -->
  <rect width="1200" height="320" fill="#f7f3ed" rx="16"/>

  <!-- Top accent rule — cinnabar -->
  <rect x="0" y="0" width="1200" height="2" fill="#c44536" rx="1"/>

  <!-- Short cinnabar rule above title -->
  <rect x="560" y="72" width="80" height="2" fill="#c44536" rx="1"/>

  <!-- Compass icon — cinnabar, low opacity, centered above title -->
  <g transform="translate(584, 92)" opacity="0.25">
    <circle cx="16" cy="16" r="14" fill="none" stroke="#c44536" stroke-width="1"/>
    <polygon points="16,4 19,14 28,16 19,18 16,28 13,18 4,16 13,14" fill="#c44536"/>
  </g>

  <!-- Title — charcoal, bold -->
  <text x="600" y="180" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="bold" fill="#2a2520" letter-spacing="-1">
    VoyagerAI
  </text>

  <!-- Tagline — muted, uppercase, wide tracking -->
  <text x="600" y="210" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#7a7367" letter-spacing="3">
    AI-POWERED TRAVEL PLANNING
  </text>

  <!-- Subtitle — muted, italic -->
  <text x="600" y="238" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#7a7367" font-style="italic">
    Multi-agent · Conversational · Grounded in live data
  </text>

  <!-- Bottom accent rule — cinnabar -->
  <rect x="0" y="318" width="1200" height="2" fill="#c44536" rx="1"/>
</svg>
